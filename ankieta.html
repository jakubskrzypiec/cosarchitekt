  <div class="subpage-hero-title reveal"><h1>ANKIETA</h1></div>
</section>
<section class="survey-layout-v7">
  <div class="survey-intro-v7 reveal">
    <p class="eyebrow">Zacznijmy od Ciebie</p>
    <div class="rotating-question rotating-question-v7" aria-live="polite"><span id="rotatingQuestion">Chcesz stworzyć z nami DOM?</span></div>
    <p>Daj nam znać, jak możemy Ci pomóc!</p>
    <p>Wypełnij ankietę i otrzymaj indywidualną ofertę.</p>
    <div class="question-dots" aria-hidden="true"><i class="active"></i><i></i><i></i></div>
  </div>
  <form class="form questionnaire-form-v7 reveal" action="https://formsubmit.co/alicjachmiel.cosinteriors@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="Nowa ankieta ze strony COS interiors">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" class="form-next" value="">
    <label><span>Imię i nazwisko</span><input type="text" name="Imię i nazwisko" required></label>
    <label><span>E-mail</span><input type="email" name="E-mail" required></label>
    <label><span>Telefon</span><input type="tel" name="Telefon" required></label>
    <label><span>Metraż wnętrza</span><input type="text" name="Metraż" placeholder="np. 62 m²"></label>
    <label><span>Lokalizacja inwestycji</span><input type="text" name="Lokalizacja" placeholder="np. Olkusz / Kraków / Warszawa"></label>
    <label><span>Kiedy chcesz zacząć?</span><select name="Termin"><option value="">Wybierz termin</option><option>Jak najszybciej</option><option>W ciągu 1–3 miesięcy</option><option>W ciągu 3–6 miesięcy</option><option>Jeszcze nie wiem</option></select></label>
    <label class="full"><span>Jaki zakres Cię interesuje?</span><select name="Zakres"><option value="">Wybierz zakres</option><option>Projekt koncepcyjny</option><option>Projekt kompleksowy</option><option>Nadzór autorski</option><option>Nie wiem — proszę o podpowiedź</option></select></label>
    <label class="full"><span>Opisz krótko wnętrze</span><textarea name="Opis wnętrza" rows="6" placeholder="Napisz, czego dotyczy projekt, na jakim etapie jest inwestycja i co jest dla Ciebie najważniejsze."></textarea></label>
    <button class="btn btn-mahogany full" type="submit">Wyślij ankietę</button>
  </form>
</section>
